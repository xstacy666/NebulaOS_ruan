[package]
name = "cryptoeng-hal"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of the OPLUS cryptoeng AIDL HAL (vendor.oplus.hardware.cryptoeng.ICryptoeng)"
license = "Apache-2.0"

[lib]
name = "cryptoeng_hal"
path = "src/lib.rs"

[[bin]]
name = "cryptoeng-hal-service"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
binder = { package = "binder_ndk", version = "0.2" }
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"

[features]
default = []
vintf_stability = []

[patch.crates-io]
binder_ndk = { path = "vendor/binder_ndk" }
binder_ndk_sys = { path = "vendor/binder_ndk_sys" }